<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MABIDA — Sub Admin</title><link rel="stylesheet" href="../../assets/css/role-dashboard.css?v=15"></head><body data-role="subadmin"><div class="role-shell"><aside class="role-sidebar"><div class="brand"><img src="../../assets/img/logo-mabida.png" alt="MABIDA"></div></div><div class="role-profile"><div class="role-profile"><b id="roleName">Sub Admin</b><small id="roleText">SUB ADMIN</small></div><nav class="role-nav"><div class="nav-section">MONITORING</div><a href="monitoringbulanan.html" data-file="monitoringbulanan.html"><span class="nav-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M8 16V6M12 16v-4M16 16V4"/><path d="M3 18h14"/></svg></span><span class="nav-label"><span class="nav-label"><span class="nav-label">Preview Monitoring Bulanan</span></span></span></a></nav></aside><main class="role-main"><header class="role-topbar"><div><small>MABIDA PROFESSIONAL / SUB ADMIN</small><h1 id="pageTitle">Preview Monitoring Bulanan</h1></div><div class="top-info"><span>Jam <b id="clock">00:00:00</b></span><span class="live">● LIVE</span><span id="date"></span><button class="header-logout" type="button" onclick="location.href='../../index.html'" aria-label="Keluar dari dashboard"><span>Keluar</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12"></path><path d="m13 6 6 6-6 6"></path></svg></button></div></header><script src="../../assets/js/role-common.js?v=15"></script><section class="content"><div class="page-head"><div><span class="eyebrow">SUB ADMIN</span><h2>Preview Monitoring Bulanan</h2><p class="sub">Ringkasan status monitoring seluruh bagian berdasarkan data browser ini.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Bulan</label><select id="month"><option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option><option>Desember</option></select></div><div class="field"><label>Tahun</label><input id="year" value="2026"></div></div><div class="actions"><button class="btn" data-print>Print</button></div></div><div class="card"><table class="table"><thead><tr><th>Bagian</th><th>Status</th></tr></thead><tbody id="monitorRows"></tbody></table></div><script>const roles=[['Kepala Sekolah','kepsek','monitoringkepsek.html'],['Waka Kurikulum','wakakur','monitoringwakakur.html'],['Waka Kesiswaan','wakasis','monitoringwakasis.html'],['Waka Humasy','wakahumasy','monitoringhumasy.html'],['Waka Sarpras','wakasarpras','monitoringsarpras.html'],['Kopsis','kopsis','monitoringkopsis.html'],['Lab Komputer','labkom','monitoringlab.html'],['Perpustakaan','perpustakaan','monitoringperpus.html']];function render(){const m=document.getElementById('month').value+' '+document.getElementById('year').value;document.getElementById('monitorRows').innerHTML=roles.map(r=>{let d={};try{d=JSON.parse(localStorage.getItem('mabida_role_'+r[1]+'_'+r[2]+'_monitor')||'{}')}catch(_){}return `<tr><td><b>${e(r[0])}</b></td><td>${d[m]?'<span class="badge success">Sudah diisi</span>':'<span class="badge warn">Belum diisi</span>'}</td></tr>`}).join('')}document.getElementById('month').onchange=render;document.getElementById('year').oninput=render;render();</script></section></main></div><script>initRoleShell('Preview Monitoring Bulanan');</script></body></html>
